<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout page</title>
    <link rel="stylesheet" href="../css/checkout.css">
</head>

<body>
    <div class="brand_name">
        <h1>Gracelyn Élan</h1>
    </div>

    <!-- main div  -->
    <div class="main_content">
        <!-- checkout_div -->
        <div class="checkout_div">
            <h1>Checkout</h1>
            <form action="post">
                <div class="customer_info">
                    <h2>Costumer Information</h2>
                    <!-- name -->
                     <div class="name flex">

                         <label class="name">Full Name</label>
                         <input type="text" placeholder="Enter your name">
                     </div>

                    <!-- email -->
                     <div class="email flex">

                         <label class="email">Email</label>
                         <input type="text" placeholder="Enter your email">
                     </div>

                </div>

                <!-- shipping info -->
                <div class="shipping_info">
                    <h2>Shipping Address</h2>
                    <!-- address_info -->
                     <div class="address flex">
                         <label class="address">Street Address</label>
                         <input type="text" placeholder="Address">
                     </div>

                     <div class="sec2 ">
                         <!-- city info -->
                         <div class="city flex">
                             <label class="city">City</label>
                             <input type="text" placeholder="city">
    
                         </div>
    
                        <!-- province -->
                         <div class="province flex">
                             <label class="provice">Province</label>
                             <input type="text" placeholder="Postal Code">
                         </div>
                     </div>

                </div>

                <!-- payment info -->
                <div class="payment_info">
                    <h2>Payment Information</h2>

                    <!-- card number -->
                     <div class="card_no flex">
                         <label class="card_no">Card Number</label>
                         <input type="text" placeholder="Card Number">

                     </div>

                    <!-- cvv -->
                     <div class="cvv flex">
                         <label class="">CVV</label>
                         <input type="text" placeholder="CVV">
                     </div>

                </div>

                <button class="place_order">
                    Place Order
                </button>


            </form>
        </div>
        <!-- items_div -->
        <div class="items_div">

        </div>
    </div>

</body>

</html>
